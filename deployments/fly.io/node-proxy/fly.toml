# fly.toml app configuration file generated for node-proxy-holy-frog-2656 on 2025-09-02T18:17:39-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'node-proxy-holy-frog-2656'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 9200
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 9200

  [[services.ports]]
    port = 9200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
